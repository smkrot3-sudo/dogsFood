<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>חזרה לאפליקציה · התקציב שלי</title>
<style>
:root { --bg: #f3f5f2; --fg: #17211c; --muted: #55635b; --accent: #1f6b4f; --on: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #141a17; --fg: #e8eee9; --muted: #9aa8a0; --accent: #5cc195; --on: #0f1a14; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 18px/1.6 "Assistant", "Segoe UI", Arial, sans-serif; }
main { max-width: 420px; padding: 32px 16px; text-align: center; display: grid; gap: 14px; }
h1 { font-size: 26px; margin: 0; }
p { margin: 0; color: var(--muted); }
a.go { display: block; background: var(--accent); color: var(--on); text-decoration: none; font-weight: 700; font-size: 20px; border-radius: 12px; padding: 16px; }
.err { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1 id="title">התחברת עם Google</h1>
  <p id="sub">עכשיו לוחצים על הכפתור כדי לחזור לאפליקציה.</p>
  <a class="go" id="go" href="#">חזרה לאפליקציה</a>
  <p id="after" hidden>אחרי שהאפליקציה נפתחת, אפשר לסגור את הלשונית הזו.</p>
</main>
<script>
// Google sign-in for the Android app ends here, in the phone's browser. Chrome won't jump into an app
// on its own after a chain of redirects, so a tap on this button hands the session to the app.
(function () {
  var search = location.search.slice(1), hash = location.hash.slice(1);
  var payload = [search, hash].filter(Boolean).join("&");
  var params = new URLSearchParams(payload);
  if (params.get("error")) {
    document.getElementById("title").textContent = "ההתחברות לא הצליחה";
    var sub = document.getElementById("sub");
    sub.textContent = params.get("error_description") || params.get("error");
    sub.className = "err";
  }
  var link = "intent://auth?" + payload + "#Intent;scheme=io.github.smkrot3sudo.budget;package=io.github.smkrot3sudo.budget;end";
  var go = document.getElementById("go");
  go.href = link;
  go.addEventListener("click", function () { document.getElementById("after").hidden = false; });
  // Remove the tokens from the address bar and history
  history.replaceState(null, "", location.pathname);
})();
</script>
</body>
</html>
