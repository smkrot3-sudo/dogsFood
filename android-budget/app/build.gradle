plugins { id "com.android.application" }

android {
    namespace "io.github.smkrot3sudo.budget"
    compileSdk 36
    defaultConfig {
        applicationId "io.github.smkrot3sudo.budget"
        minSdk 24
    }
    buildFeatures { buildConfig true }
    // site: the APK on the website (self-update, payment detection). play: the Google Play build.
    flavorDimensions = ["where"]
    productFlavors {
        site {
            dimension "where"
            targetSdk 34
            versionCode 15
            versionName "2.4"
            buildConfigField "boolean", "STORE", "false"
        }
        play {
            dimension "where"
            // Google Play takes new apps only when they target Android 16 (API 36)
            targetSdk 36
            versionCode 100
            versionName "2.2"
            buildConfigField "boolean", "STORE", "true"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed afterwards with the project's own key (kept out of the repo)
            signingConfig null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
